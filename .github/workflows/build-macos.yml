name: build-macos

# 触发：手动 Run workflow，或推送 v* tag
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（如 v2.1.7）。留空则只 build 上传 artifact，不发 release'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18.20.8'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS（arm64 + x64 dmg）
        run: npx electron-builder --mac --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ''

      - name: List release artifacts
        run: |
          echo "=== release/ ==="
          ls -la release/ 2>&1 || true
          find release -maxdepth 2 -type f | head -50

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kakao-chat-viewer-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/builder-debug.yml
          if-no-files-found: error
          retention-days: 14

      - name: Publish to release（tag 推送）
        if: ${{ github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.dmg
            release/*-mac.zip

      - name: Publish to release（手动填了 tag）
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          generate_release_notes: true
          files: |
            release/*.dmg
            release/*-mac.zip
