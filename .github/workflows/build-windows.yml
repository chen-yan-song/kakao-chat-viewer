name: build-windows

# 触发条件：
# 1) 手动：Actions 页面 Run workflow（输入 release tag 可选）
# 2) 自动：推送形如 v* 的 tag → build 后自动 publish 到同名 release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.0.2). 留空则只 build，不发 release'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    # 强制从默认值取 token（避免内部分支被改写）
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18.20.8'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows (Setup + Portable)
        run: npx electron-builder --win --publish never
        env:
          # 不让 electron-builder 推代码签名（无 EV 证书）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # 显式置空，避免 CI 模式下自动 publish
          GH_TOKEN: ''
          GH_RELEASE: 'false'

      - name: List release artifacts
        shell: bash
        run: |
          echo "=== release/ contents ==="
          ls -la release/ 2>&1 || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kakao-chat-viewer-windows
          path: |
            release/KakaoChat-Viewer-Setup-*.exe
            release/KakaoChat-Viewer-Portable-*.exe
            release/*.blockmap
            release/builder-debug.yml
          if-no-files-found: error
          retention-days: 14

      # 仅当 push 形如 v* 的 tag 时，自动创建/更新同名 release
      - name: Publish to release (tag push only)
        if: ${{ env.GITHUB_EVENT_NAME == 'push' }}
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.GITHUB_REF_NAME }}
          name: ${{ env.GITHUB_REF_NAME }}
          generate_release_notes: true
          files: |
            release/KakaoChat-Viewer-Setup-*.exe
            release/KakaoChat-Viewer-Portable-*.exe
